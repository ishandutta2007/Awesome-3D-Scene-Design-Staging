<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420" style="background: #080d19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Radial Gradients -->
    <radialGradient id="bg-glow-1" cx="20%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#080d19" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bg-glow-2" cx="80%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#080d19" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="stage-spot" cx="50%" cy="90%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#080d19" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Gradients -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="cube-grad-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="cube-grad-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="cube-grad-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <linearGradient id="pill-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.4" />
    </linearGradient>

    <!-- Dynamic CSS Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-16px) rotate(4deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(14px) rotate(-3deg); }
      }
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.25; transform: scaleY(1); }
        50% { opacity: 0.6; transform: scaleY(1.08); }
      }
      @keyframes orbitLight {
        0% { transform: rotate(0deg) translateX(45px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(45px) rotate(-360deg); }
      }
      @keyframes gridPulse {
        0%, 100% { opacity: 0.12; }
        50% { opacity: 0.28; }
      }
      .floating-stage-cube {
        animation: floatSlow 7s ease-in-out infinite;
        transform-origin: 1040px 190px;
      }
      .floating-stage-sphere {
        animation: floatReverse 8.5s ease-in-out infinite;
        transform-origin: 140px 240px;
      }
      .staging-beam {
        animation: pulseBeam 4.5s ease-in-out infinite;
        transform-origin: bottom center;
      }
      .grid-lines {
        animation: gridPulse 6s ease-in-out infinite;
      }
      .orbit-particle {
        animation: orbitLight 9s linear infinite;
        transform-origin: 1040px 190px;
      }
    </style>
  </defs>

  <!-- Ambient Background Canvas -->
  <rect width="1200" height="420" fill="#080d19" />
  <rect width="1200" height="420" fill="url(#bg-glow-1)" />
  <rect width="1200" height="420" fill="url(#bg-glow-2)" />
  <ellipse cx="600" cy="400" rx="550" ry="120" fill="url(#stage-spot)" />

  <!-- Perspective 3D Stage Grid Floor in Background -->
  <g class="grid-lines" stroke="#38bdf8" stroke-width="1.2">
    <!-- Horizon Line -->
    <line x1="50" y1="310" x2="1150" y2="310" stroke-opacity="0.4" />
    
    <!-- Floor Grid Rings / Depth Lines -->
    <line x1="120" y1="330" x2="1080" y2="330" stroke-opacity="0.35" />
    <line x1="60" y1="355" x2="1140" y2="355" stroke-opacity="0.3" />
    <line x1="0" y1="385" x2="1200" y2="385" stroke-opacity="0.25" />
    <line x1="0" y1="418" x2="1200" y2="418" stroke-opacity="0.2" />

    <!-- Perspective Converging Lines (Vanishing toward center horizon) -->
    <line x1="600" y1="310" x2="600" y2="420" stroke-opacity="0.5" />
    <line x1="600" y1="310" x2="450" y2="420" stroke-opacity="0.35" />
    <line x1="600" y1="310" x2="300" y2="420" stroke-opacity="0.35" />
    <line x1="600" y1="310" x2="120" y2="420" stroke-opacity="0.25" />
    <line x1="600" y1="310" x2="-80" y2="420" stroke-opacity="0.2" />
    <line x1="600" y1="310" x2="750" y2="420" stroke-opacity="0.35" />
    <line x1="600" y1="310" x2="900" y2="420" stroke-opacity="0.35" />
    <line x1="600" y1="310" x2="1080" y2="420" stroke-opacity="0.25" />
    <line x1="600" y1="310" x2="1280" y2="420" stroke-opacity="0.2" />
  </g>

  <!-- Ambient Light Stage Cones (Background) -->
  <polygon points="200,-20 120,380 340,380" fill="#38bdf8" opacity="0.06" class="staging-beam" />
  <polygon points="1000,-20 860,380 1080,380" fill="#818cf8" opacity="0.08" class="staging-beam" />

  <!-- Animated Dynamic Background Element: Left Floating Camera / Sphere -->
  <g class="floating-stage-sphere">
    <ellipse cx="140" cy="220" rx="36" ry="12" fill="#030712" opacity="0.4" />
    <circle cx="140" cy="190" r="32" fill="url(#bg-glow-2)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" />
    <circle cx="140" cy="190" r="24" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.8" />
    <!-- Camera aperture / target marker -->
    <circle cx="140" cy="190" r="8" fill="#38bdf8" />
    <line x1="140" y1="165" x2="140" y2="215" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,2" />
    <line x1="115" y1="190" x2="165" y2="190" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,2" />
  </g>

  <!-- Animated Dynamic Background Element: Right Isometric 3D Staging Cube -->
  <g class="floating-stage-cube">
    <!-- Cast Shadow -->
    <ellipse cx="1040" cy="270" rx="55" ry="18" fill="#000000" opacity="0.45" />

    <!-- Isometric Cube: Top Face -->
    <polygon points="1040,110 1095,142 1040,174 985,142" fill="url(#cube-grad-top)" />
    <!-- Isometric Cube: Left Face -->
    <polygon points="985,142 1040,174 1040,238 985,206" fill="url(#cube-grad-left)" />
    <!-- Isometric Cube: Right Face -->
    <polygon points="1040,174 1095,142 1095,206 1040,238" fill="url(#cube-grad-right)" />
    
    <!-- Coordinate Gizmo Lines (X-Red, Y-Green, Z-Blue) -->
    <line x1="1040" y1="174" x2="1040" y2="85" stroke="#22c55e" stroke-width="3" stroke-linecap="round" />
    <line x1="1040" y1="174" x2="1115" y2="218" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <line x1="1040" y1="174" x2="965" y2="218" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
    
    <!-- Orbiting Lighting Point -->
    <circle cx="1040" cy="174" r="5" fill="#facc15" class="orbit-particle">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Center Foreground Content: Clean, High-Contrast Typography & Feature Badges -->
  <g id="foreground-hero-content">
    <!-- Category Super-Title / Pill -->
    <g transform="translate(600, 72)">
      <rect x="-185" y="-17" width="370" height="34" rx="17" fill="#0f172a" fill-opacity="0.85" stroke="url(#pill-border)" stroke-width="1.4" />
      <circle cx="-160" cy="0" r="4.5" fill="#22c55e" />
      <text x="-142" y="5" fill="#93c5fd" font-size="12.5" font-weight="700" letter-spacing="2">CURATED ECOSYSTEM INDEX</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="152" text-anchor="middle" fill="url(#text-grad)" font-size="44" font-weight="800" letter-spacing="-0.8">Awesome 3D Scene Design &amp; Staging</text>

    <!-- Subtitle / Value Proposition -->
    <text x="600" y="196" text-anchor="middle" fill="#cbd5e1" font-size="17" font-weight="400" letter-spacing="0.2">Real-Time Rendering • Architectural Visualization • Self-Hosted Pipelines • Spatial Workflows</text>

    <!-- Staging Feature Pills in Foreground -->
    <g transform="translate(600, 248)">
      <!-- Pill 1: Real-Time Lighting -->
      <g transform="translate(-320, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
        <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">⚡ Real-Time PBR</text>
      </g>
      <!-- Pill 2: ArchViz Staging -->
      <g transform="translate(-160, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.7" />
        <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">🏛️ ArchViz Studios</text>
      </g>
      <!-- Pill 3: Open-Source First -->
      <g transform="translate(0, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.7" />
        <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">🔓 Open-Source</text>
      </g>
      <!-- Pill 4: Product Mockups -->
      <g transform="translate(160, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#f472b6" stroke-width="1.2" stroke-opacity="0.7" />
        <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">📦 Product Staging</text>
      </g>
      <!-- Pill 5: Cloud & WebGPU -->
      <g transform="translate(320, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.7" />
        <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">🌐 WebGPU / SaaS</text>
      </g>
    </g>
  </g>
</svg>
